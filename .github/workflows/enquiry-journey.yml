name: Enquiry journey
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_site.py
      - run: pip install playwright==1.58.0
      - run: python scripts/test_enquiry_journey.py
        env:
          CHROME_CHANNEL: chrome
